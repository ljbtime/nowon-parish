<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 – 노원성당</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #e6f0fb 0%, #fbf5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrap {
      background: #fff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-logo {
      font-size: 2.5rem;
      color: #b8953a;
      margin-bottom: 0.5rem;
    }
    .login-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #2f5d9b;
      margin-bottom: 0.25rem;
    }
    .login-sub {
      font-size: 0.82rem;
      color: #999;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #2f5d9b; }
    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: #2f5d9b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    .btn-login:hover { background: #244b82; }
    .error-msg {
      color: #e53e3e;
      font-size: 0.82rem;
      margin-top: 0.75rem;
      display: none;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: #999;
      text-decoration: none;
    }
    .back-link:hover { color: #2f5d9b; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">✝</div>
    <h1 class="login-title">노원성당 관리자</h1>
    <p class="login-sub">관리자 계정으로 로그인하세요</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="관리자 권한이 있는 회원 이메일" required />
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력" required />
      </div>
      <button type="submit" class="btn-login">로그인</button>
      <p class="error-msg" id="errorMsg">이메일 또는 비밀번호가 올바르지 않습니다.</p>
    </form>
    <a href="../index.html" class="back-link">← 홈페이지로 돌아가기</a>
  </div>

  <script type="module">
    // Firebase Auth 로그인 + admin 권한(custom claim) 확인
    import { auth } from '../js/firebase-config.js';
    import { signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const errorMsg = document.getElementById('errorMsg');
    const showErr = msg => { errorMsg.textContent = msg; errorMsg.style.display = 'block'; };

    async function enterIfAdmin(user) {
      const token = await user.getIdTokenResult();
      if (!token.claims.admin) return false;
      sessionStorage.setItem('adminLoggedIn', 'true');
      window.location.href = 'dashboard.html';
      return true;
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      errorMsg.style.display = 'none';
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        if (!(await enterIfAdmin(cred.user))) {
          await signOut(auth);
          showErr('관리자 권한이 없는 계정입니다.');
        }
      } catch {
        showErr('이메일 또는 비밀번호가 올바르지 않습니다.');
      }
    });

    // 이미 관리자 계정으로 로그인된 경우
    const stop = onAuthStateChanged(auth, user => { stop(); if (user) enterIfAdmin(user); });
  </script>
</body>
</html>
